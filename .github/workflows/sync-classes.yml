name: Sync Portuguese classes

on:
  schedule:
    - cron: "20 7 * * *"      # 07:20 UTC — early morning in New York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-classes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet icalendar recurring-ical-events requests

      - name: Build classes.json
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          CLASS_KEYWORDS: ${{ vars.CLASS_KEYWORDS }}
        run: python scripts/sync_classes.py

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain projects/caderno/data/classes.json)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/caderno/data/classes.json
          git commit -m "Sync classes from Google Calendar"
          git push
